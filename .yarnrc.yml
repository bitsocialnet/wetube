nodeLinker: node-modules

# Dependencies run no install scripts; nothing in this browser client needs them.
enableScripts: false

defaultSemverRangePrefix: ""

checksumBehavior: throw

npmMinimalAgeGate: 3d

npmPreapprovedPackages:
  # WeTube tracks 5chan's pkc-js / hooks versions so protocol fixes land here without a 3-day lag.
  - "@bitsocial/bitsocial-react-hooks"
  - "@bitsocial/bso-resolver"
  - "@pkcprotocol/pkc-js"

packageExtensions:
  element-source@0.0.5:
    peerDependencies:
      "@types/react": ">=18.0.0"
      react: ">=17.0.1"
